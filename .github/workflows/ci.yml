name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: doggodex
          POSTGRES_PASSWORD: doggodex
          POSTGRES_DB: doggodex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doggodex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=doggodex_test;Username=doggodex;Password=doggodex"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip notice (solution not created yet)
        if: hashFiles('DoggoDex.sln') == ''
        run: echo "DoggoDex.sln not found yet (waiting for DOG-1). Skipping build and test."

      - name: Setup .NET
        if: hashFiles('DoggoDex.sln') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        if: hashFiles('DoggoDex.sln') != ''
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        if: hashFiles('DoggoDex.sln') != ''
        run: dotnet restore DoggoDex.sln

      - name: Build
        if: hashFiles('DoggoDex.sln') != ''
        run: dotnet build DoggoDex.sln --configuration Release --no-restore

      - name: Test
        if: hashFiles('DoggoDex.sln') != ''
        run: >
          dotnet test DoggoDex.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always() && hashFiles('DoggoDex.sln') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  docker-build:
    name: Docker images build
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        if: hashFiles('src/DoggoDex.Api/DoggoDex.Api.csproj') != ''
        run: docker build -f Dockerfile.api -t doggodex-api:ci .

      - name: Build Web image
        if: hashFiles('src/DoggoDex.Web/DoggoDex.Web.csproj') != ''
        run: docker build -f Dockerfile.web -t doggodex-web:ci .
